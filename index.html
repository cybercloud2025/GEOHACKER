<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACCESO AL SISTEMA</title>

  <!-- Security headers (frontend-side hardening) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://*.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https: https://*.googleusercontent.com https://*.gstatic.com;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://maps.googleapis.com https://api.emailjs.com;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  " />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(self), camera=(), microphone=(), payment=()" />
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Critical Preloads -->
  <link rel="preload" href="/src/assets/hacker-icon.png" as="image" />
  
  <style>
    body { background-color: #000; margin: 0; padding: 0; }
    #root-preloader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="root-preloader">
      <div style="width: 40px; height: 40px; border: 2px solid rgba(0,255,255,0.1); border-top-color: #00ffff; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
