<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geohacker — Presentación</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #000;
    color: #00ff9c;
    overflow: hidden;
    height: 100vh;
  }
  #stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #matrix {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; opacity: 0.08;
    pointer-events: none;
  }
  .slide {
    flex: 1;
    padding: 60px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  h1 {
    color: #60A5FA;
    font-size: 56px;
    margin-bottom: 28px;
    text-shadow: 0 0 20px rgba(96,165,250,0.6);
    border-bottom: 2px solid #60A5FA;
    padding-bottom: 18px;
    letter-spacing: 2px;
  }
  h2 {
    color: #a855f7;
    font-size: 24px;
    margin-top: 24px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  ul { list-style: none; }
  li {
    padding: 10px 0 10px 28px;
    font-size: 20px;
    color: #e2e8f0;
    position: relative;
  }
  li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: #00ff9c;
    text-shadow: 0 0 8px rgba(0,255,156,0.8);
  }
  .hero {
    text-align: center;
  }
  .hero h1 {
    border: none;
    font-size: 96px;
    letter-spacing: 12px;
  }
  .hero p {
    font-size: 28px;
    color: #94a3b8;
    margin-top: 30px;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid #00ff9c;
    border-radius: 4px;
    margin: 4px;
    font-size: 14px;
    color: #00ff9c;
  }
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.95);
    border-top: 1px solid #00ff9c;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }
  #controls button {
    background: transparent;
    border: 1px solid #00ff9c;
    color: #00ff9c;
    padding: 8px 18px;
    margin: 0 4px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  #controls button:hover {
    background: #00ff9c;
    color: #000;
    box-shadow: 0 0 16px rgba(0,255,156,0.5);
  }
  #controls button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  #counter {
    font-size: 14px;
    color: #94a3b8;
    letter-spacing: 1px;
  }
  #voiceSelect {
    background: #0a0a0a;
    color: #00ff9c;
    border: 1px solid #00ff9c;
    padding: 6px 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  .rate-control {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    font-size: 12px;
  }
  input[type=range] {
    accent-color: #00ff9c;
  }
  .panel {
    background: rgba(10, 10, 10, 0.85);
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 24px 32px;
    margin: 12px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .cell {
    background: rgba(96,165,250,0.05);
    border-left: 3px solid #60A5FA;
    padding: 16px 20px;
  }
  .cell h3 {
    color: #60A5FA;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .cell p {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.5;
  }
  .status {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 16px;
    border: 1px solid #60A5FA;
    background: rgba(0,0,0,0.7);
    font-size: 12px;
    color: #60A5FA;
    border-radius: 4px;
    z-index: 100;
  }
  .speaking {
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,156,0.7); }
    50% { box-shadow: 0 0 0 12px rgba(0,255,156,0); }
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="status" id="status">⏸ DETENIDO</div>
<div id="stage"></div>

<div id="controls">
  <div>
    <button id="btnPrev">◀ ANTERIOR</button>
    <button id="btnPlay">▶ REPRODUCIR</button>
    <button id="btnPause">⏸ PAUSA</button>
    <button id="btnNext">SIGUIENTE ▶</button>
    <button id="btnAuto">⟳ AUTO</button>
    <button id="btnRestart">⏮ INICIO</button>
  </div>
  <div style="display:flex;gap:16px;align-items:center;">
    <div class="rate-control">
      <span>VEL:</span>
      <input type="range" id="rate" min="0.7" max="1.4" step="0.05" value="1.0" style="width:80px;">
      <span id="rateLabel">1.0x</span>
    </div>
    <select id="voiceSelect"></select>
    <span id="counter">0 / 0</span>
  </div>
</div>

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const statusEl = document.getElementById('status');
const voiceSel = document.getElementById('voiceSelect');
const rateInput = document.getElementById('rate');
const rateLabel = document.getElementById('rateLabel');
let current = 0;
let autoMode = false;
let isSpeaking = false;

function renderSlide(i) {
  const s = slides[i];
  let html = '';
  if (s.layout === 'hero') {
    html = `<div class="slide hero">
      <h1>${s.title}</h1>
      <p>${s.subtitle}</p>
    </div>`;
  } else {
    html = `<div class="slide">
      <h1>${s.title}</h1>
      <ul>${s.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
    </div>`;
  }
  stage.innerHTML = html;
  counter.textContent = `${i+1} / ${slides.length}`;
}

let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('es'));
  voiceSel.innerHTML = '';
  voices.forEach((v, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSel.appendChild(opt);
  });
  if (voices.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = 'Voz por defecto';
    voiceSel.appendChild(opt);
  }
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  u.rate = parseFloat(rateInput.value);
  u.pitch = 1.0;
  if (voices.length > 0) {
    u.voice = voices[parseInt(voiceSel.value) || 0];
  }
  u.onstart = () => {
    isSpeaking = true;
    statusEl.textContent = '▶ NARRANDO';
    statusEl.classList.add('speaking');
  };
  u.onend = () => {
    isSpeaking = false;
    statusEl.classList.remove('speaking');
    statusEl.textContent = '⏸ DETENIDO';
    if (autoMode && current < slides.length - 1) {
      setTimeout(() => {
        current++;
        renderSlide(current);
        speak(slides[current].narration);
      }, 800);
    } else if (autoMode && current === slides.length - 1) {
      autoMode = false;
      statusEl.textContent = '✓ FIN';
    }
  };
  speechSynthesis.speak(u);
}

document.getElementById('btnPrev').onclick = () => {
  if (current > 0) {
    current--;
    renderSlide(current);
    speak(slides[current].narration);
  }
};
document.getElementById('btnNext').onclick = () => {
  if (current < slides.length - 1) {
    current++;
    renderSlide(current);
    speak(slides[current].narration);
  }
};
document.getElementById('btnPlay').onclick = () => {
  speak(slides[current].narration);
};
document.getElementById('btnPause').onclick = () => {
  speechSynthesis.cancel();
  autoMode = false;
  statusEl.textContent = '⏸ PAUSADO';
  statusEl.classList.remove('speaking');
};
document.getElementById('btnAuto').onclick = () => {
  autoMode = true;
  speak(slides[current].narration);
};
document.getElementById('btnRestart').onclick = () => {
  speechSynthesis.cancel();
  current = 0;
  renderSlide(current);
  autoMode = false;
  statusEl.textContent = '⏸ DETENIDO';
};
rateInput.oninput = () => {
  rateLabel.textContent = parseFloat(rateInput.value).toFixed(2) + 'x';
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
  if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btnPlay').click(); }
});

const cvs = document.getElementById('matrix');
const ctx = cvs.getContext('2d');
cvs.width = window.innerWidth;
cvs.height = window.innerHeight;
const chars = '0123456789ABCDEFハッカーGEOHACKER';
const fontSize = 16;
const cols = cvs.width / fontSize;
const drops = Array(Math.floor(cols)).fill(1);
function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.fillStyle = '#00ff9c';
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const txt = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(txt, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > cvs.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 50);
window.addEventListener('resize', () => {
  cvs.width = window.innerWidth;
  cvs.height = window.innerHeight;
});

renderSlide(0);
</script>
</body>
</html>
